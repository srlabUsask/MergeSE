# /etc/nginx/sites-available/mergese
#
# nginx site definition for https://mergeSE.usask.ca
# Assumes the MergeSE container (or gunicorn) is listening on 127.0.0.1:8765.
# Obtain TLS certs with certbot first:
#   sudo certbot --nginx -d mergese.usask.ca
#
# Notes
# -----
# * SSE: proxy_buffering must be off, and chunked_transfer_encoding on, otherwise
#   the browser will see logs only after the job completes.
# * If you put cloudflare/usask CDN in front, also set the long-polling headers
#   on its side.

upstream mergese_upstream {
    server 127.0.0.1:8765 fail_timeout=0;
}

# Per-client-IP rate limiting to blunt request floods.
#  * general: ordinary browsing + metadata reads
#  * jobs:    endpoints that start compute work (merge/eval/export/inspect/uploads/datasets)
#  * anon:    the bot-challenge endpoint (expensive upstream Turnstile call)
# Put a CDN or Cloudflare in front for volumetric DDoS protection as well.
limit_req_zone  $binary_remote_addr zone=mergese_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=mergese_jobs:10m    rate=1r/s;
limit_req_zone  $binary_remote_addr zone=mergese_anon:10m    rate=2r/s;
limit_conn_zone $binary_remote_addr zone=mergese_conn:10m;

# Return 429 Too Many Requests on rate-limit hit instead of nginx's default
# 503 Service Unavailable - 429 tells the client "try later" (with Retry-After
# if we set one), 503 looks like the backend is down. Stress testing flagged
# the 503s as scary (B3 in the report).
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name mergese.usask.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mergese.usask.ca;

    # certbot manages these
    ssl_certificate     /etc/letsencrypt/live/mergese.usask.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mergese.usask.ca/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 3g;     # DEFAULT: checkpoint uploads (set MERGESE_MAX_UPLOAD_BYTES to match)
    proxy_read_timeout   3600s;  # long-running merges/evaluations
    proxy_request_buffering off; # stream large uploads straight through to gunicorn

    # Cap concurrent connections per IP.
    limit_conn mergese_conn 20;

    # Per-location body caps + rate limits for the small-payload endpoints
    # (B3/B4 in the stress report). The 3g default is for /api/uploads; every
    # other API endpoint is JSON. A malicious client could stream 50MB of JSON
    # into memory before Flask would reject; 8k is more than any legitimate
    # payload here (the longest body - a merge request - is <2 KB).
    #
    # /api/v1/anon-token gets its own tighter rate zone: each hit triggers an
    # outbound Cloudflare Turnstile verify, which blocks the single gunicorn
    # worker. 2 r/s with a 5-burst is enough for a page refresh storm but
    # not enough for a sustained flood.
    location = /api/v1/anon-token {
        client_max_body_size 8k;
        limit_req zone=mergese_anon burst=5 nodelay;
        proxy_pass http://mergese_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/limits {
        client_max_body_size 8k;
        proxy_pass http://mergese_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/health {
        client_max_body_size 1k;
        proxy_pass http://mergese_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static frontend assets are served from the same upstream; nginx caches them briefly.
    location ~* \.(css|js|svg|ico|woff2?)$ {
        proxy_pass http://mergese_upstream;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # SSE streaming endpoint - buffering MUST be off
    location ~ ^/api/jobs/[^/]+/stream$ {
        proxy_pass http://mergese_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_cache off;
        proxy_read_timeout 24h;
        add_header X-Accel-Buffering no;
    }

    # Job-starting and upload endpoints: tighter rate limit.
    location ~ ^/api/(inspect|merge|evaluate|export|uploads|datasets)$ {
        limit_req zone=mergese_jobs burst=5 nodelay;
        proxy_pass http://mergese_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=mergese_general burst=20 nodelay;
        proxy_pass http://mergese_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
