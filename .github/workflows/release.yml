name: Release

# When a `v*` tag is pushed, build the sdist + wheel + ONNX export extras,
# smoke-test the fresh install, and publish both the artefacts to a GitHub
# Release. PyPI publish is wired behind a secret but kept off by default so a
# first-time tag doesn't accidentally push to PyPI; flip the `publish-pypi`
# input of the workflow_dispatch to turn it on when the account is ready.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish-pypi:
        description: "Also publish the built artefacts to PyPI"
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # for creating the GitHub Release
  id-token: write  # for PyPI trusted publishing (OIDC), when enabled

jobs:
  build:
    name: Build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tag history for setuptools-scm compatibility
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve version
        id: version
        run: |
          # If invoked by a tag, use that; else fall back to the version in pyproject.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version: $v"
      - name: Build
        run: |
          python -m pip install --upgrade pip build==1.2.2
          python -m build --sdist --wheel --outdir dist
          ls -la dist/
      - name: Smoke-install the built wheel
        # Mirrors the wheel.yml smoke, kept here so a tagged release can
        # never go out without the install-side check passing.
        #
        # The `.[server]` form was being resolved relative to /tmp/release-smoke
        # (where there is no pyproject.toml) and failing with
        # "Directory '.[server]' is not installable". The correct syntax is
        # to attach the extra to the wheel path itself: pip install "<WHL>[server]".
        run: |
          mkdir -p /tmp/release-smoke
          cd /tmp/release-smoke
          python -m venv .venv
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          WHL=$(ls "$GITHUB_WORKSPACE"/dist/*.whl | head -n 1)
          .venv/bin/pip install "${WHL}[server]" --find-links "$GITHUB_WORKSPACE"/dist
          .venv/bin/python -c "import server.app as a; print('OK routes=', len(a.app.url_map._rules))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 90

  github-release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Mark as prerelease when the tag has a hyphen (v0.3.0-rc1, etc).
          prerelease: ${{ contains(github.ref_name, '-') }}

  pypi-publish:
    name: Publish to PyPI (opt-in)
    needs: build
    # Only publish when (a) tag push AND the operator has set the
    # `PYPI_PUBLISH` repository variable to "1", or (b) a workflow_dispatch
    # invocation with publish-pypi=true was triggered deliberately.
    if: >-
      (startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == '1') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish-pypi == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi  # requires a protected GH Environment; add reviewers for extra guard
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish via trusted publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
